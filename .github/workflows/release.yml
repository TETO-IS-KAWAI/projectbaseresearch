# Windows 배포 파일 빌드 + GitHub Release 게시
#
#   git tag v2.0.0 && git push origin v2.0.0   → 설치 파일·휴대용 zip 을 만들어 Release 에 올림
#   Actions 탭에서 'Run workflow'               → 빌드만 하고 결과는 Artifacts 로 받음 (게시 안 함)
#
# 태그 이름은 rt_v2/api.py 의 APP_VERSION 과 같아야 한다 (v + 버전).
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: rt_v2/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rt_v2/requirements.txt -r rt_v2/requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Select-String -Path rt_v2/api.py -Pattern "APP_VERSION\s*=\s*'([\d.]+)'").Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != APP_VERSION $v" }

      - name: Build installer and portable zip
        run: python -X utf8 rt_v2/packaging/make_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: RWA_HI21cm-windows
          path: rt_v2/dist/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          rt_v2/dist/release/RWA_HI21cm-*-setup.exe
          rt_v2/dist/release/RWA_HI21cm-*-portable-win64.zip
          rt_v2/dist/release/SHA256SUMS.txt
          --title "HI 21cm 전파망원경 ${{ github.ref_name }}"
          --notes-file rt_v2/dist/release/RELEASE_NOTES.md
          --verify-tag
